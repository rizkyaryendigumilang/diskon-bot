name: CI - DiskonBot

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.html'
      - '*.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-vps.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - '*.html'
      - '*.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskon-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python dashboard and bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q -x '(^|/)(__pycache__|android|ios)/' .
      - name: Validate dashboard entry point
        run: test -s index.html && test -s server.py && test -s bot.py
      - name: Run automated test suite
        run: python -m unittest test_app.py
      - name: Detect database files tracked in Git
        run: |
          if git ls-files '*.db' '*.sqlite' '*.sqlite3' | grep -q .; then
            echo "::warning::Database files are tracked in this repository. The production deployment must preserve live database files and must not copy repository databases over them."
          fi
