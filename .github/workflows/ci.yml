name: DiskonBot CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "infra/**"

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py converter.py database.py scraper.py server.py start_all.py
      - name: Build Docker image
        run: docker build -t diskon-bot:ci .
