name: CI - DiskonBot

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.html'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskon-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python dashboard and bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependency consistency
        run: pip check

      - name: Compile Python modules
        run: python -m compileall -q -x '(^|/)(__pycache__|android|ios)/' .

      - name: Validate entry points and core modules
        run: |
          test -s index.html && \
          test -s server.py && \
          test -s bot.py && \
          test -s database.py && \
          test -s converter.py && \
          test -s scraper.py && \
          test -s config.py

      - name: Run automated test suite
        run: python -m unittest test_app.py

      - name: Security check - Detect database files tracked in Git
        run: |
          if git ls-files '*.db' '*.sqlite' '*.sqlite3' | grep -q .; then
            echo "::error::Database files are tracked in Git. Remove them using 'git rm --cached'."
            exit 1
          fi

      - name: Security check - Ensure live .env files are not tracked in Git
        run: |
          if git ls-files '.env' '.env.*' ':!.env.example' | grep -q .; then
            echo "::error::Live .env files are tracked in Git. Remove them from git index."
            exit 1
          fi
