name: Deploy DiskonBot to VPS

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.html'
      - '*.txt'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskon-bot-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q -x '(^|/)(__pycache__|android|ios)/' .
      - name: Verify deployment source files
        run: test -s server.py && test -s bot.py && test -s index.html && test -s requirements.txt

  deploy:
    name: Deploy dashboard code and restart existing service
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source without runtime data or credentials
        run: |
          set -euo pipefail
          pkg_tmp="${RUNNER_TEMP:-/tmp}/diskon-pack-${GITHUB_SHA}"
          mkdir -p "$pkg_tmp"
          tar --exclude='.git' --exclude='*.db' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='config.py' --exclude='.env' --exclude='.env.*' --exclude='__pycache__' --exclude='android' --exclude='ios' -czf "$pkg_tmp/diskon-source.tar.gz" .
          mv "$pkg_tmp/diskon-source.tar.gz" diskon-source.tar.gz
          rm -rf "$pkg_tmp"
      - name: Configure verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_KEY" && test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "Configure VPS_HOST, VPS_USERNAME, VPS_SSH_KEY and verified VPS_SSH_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload source archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" diskon-source.tar.gz "$VPS_USER@$VPS_HOST:diskon-source-${GITHUB_SHA}.tar.gz"
      - name: Validate services, back up, deploy and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DISKON_DEPLOY_DIR || '/home/ubuntu/platform-repos/diskon-bot' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$DEPLOY_DIR' '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          release="$2"
          service="diskon-bot-dashboard.service"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -d "$live" && test ! -L "$live" || { echo "Deployment directory not found: $live"; exit 1; }
          command -v rsync >/dev/null
          sudo -n systemctl cat "$service" >/dev/null
          sudo -n systemctl is-active "$service" >/dev/null
          test "$(sudo -n systemctl show -p WorkingDirectory --value "$service")" = "$live" || { echo "Service WorkingDirectory differs from expected deployment directory."; exit 1; }
          backup="$HOME/diskon-backup-$release.tar.gz"
          stage="$HOME/diskon-stage-$release"
          test ! -e "$backup" && test ! -e "$stage"
          mkdir "$stage"
          tar -xzf "$HOME/diskon-source-$release.tar.gz" -C "$stage"
          tar --exclude='*.db' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='config.py' --exclude='.env' --exclude='.env.*' --exclude='.git' --exclude='__pycache__' --exclude='venv' --exclude='.venv' --exclude='node_modules' --exclude='.runtime' -czf "$backup" -C "$live" .
          rollback() {
            status="${1:-$?}"
            trap - ERR
            if [ -s "$backup" ]; then
              restore="$HOME/diskon-restore-$release"
              rm -rf "$restore"
              mkdir -p "$restore"
              tar -xzf "$backup" -C "$restore"
              rsync -a --delete --exclude='*.db' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='config.py' --exclude='.env' --exclude='.env.*' --exclude='.git' --exclude='__pycache__' --exclude='venv' --exclude='.venv' --exclude='node_modules' --exclude='.runtime' "$restore/" "$live/"
              sudo -n systemctl restart "$service" || true
              rm -rf "$restore"
            fi
            rm -rf "$stage"
            rm -f "$HOME/diskon-source-$release.tar.gz"
            exit "$status"
          }
          trap 'rollback $?' ERR
          rsync -a --delete --exclude='*.db' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='config.py' --exclude='.env' --exclude='.env.*' --exclude='.git' --exclude='__pycache__' --exclude='venv' --exclude='.venv' --exclude='node_modules' --exclude='.runtime' "$stage/" "$live/"
          sudo -n systemctl restart "$service"
          healthy=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Web health check failed; rolling back."
            rollback 1
          fi
          trap - ERR
          rm -rf "$stage"
          rm -f "$HOME/diskon-source-$release.tar.gz"
          echo "Deployment successful; web endpoint returned HTTP 200. Database files, config.py and Python environments were preserved. Backup retained at $backup"
          REMOTE
