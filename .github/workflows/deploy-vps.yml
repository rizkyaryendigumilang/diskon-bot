name: Deploy DiskonBot to VPS

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.html'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskon-bot-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dependency tree
        run: pip check

      - name: Compile Python modules
        run: python -m compileall -q -x '(^|/)(__pycache__|android|ios)/' .

      - name: Verify deployment source files
        run: |
          test -s server.py && \
          test -s bot.py && \
          test -s index.html && \
          test -s requirements.txt && \
          test -s config.py && \
          test -s database.py

      - name: Run automated test suite
        run: python -m unittest test_app.py

      - name: Verify no database files tracked in Git
        run: |
          if git ls-files '*.db' '*.sqlite' '*.sqlite3' | grep -q .; then
            echo "::error::Database files are tracked in Git. Remove them using 'git rm --cached'."
            exit 1
          fi

      - name: Verify no live secrets tracked in Git
        run: |
          if git ls-files '.env' '.env.*' ':!.env.example' | grep -q .; then
            echo "::error::Live .env files are tracked in Git. Remove them from git index."
            exit 1
          fi

  deploy:
    name: Deploy dashboard code and restart existing service
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package source without runtime data or credentials
        run: |
          set -euo pipefail
          pkg_tmp="${RUNNER_TEMP:-/tmp}/diskon-pack-${GITHUB_SHA}"
          mkdir -p "$pkg_tmp"
          tar --exclude='.git' \
              --exclude='*.db' \
              --exclude='*.sqlite' \
              --exclude='*.sqlite3' \
              --exclude='config.py' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='__pycache__' \
              --exclude='android' \
              --exclude='ios' \
              -czf "$pkg_tmp/diskon-source.tar.gz" .
          mv "$pkg_tmp/diskon-source.tar.gz" diskon-source.tar.gz
          rm -rf "$pkg_tmp"

      - name: Configure verified SSH with strict host checking
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$VPS_HOST" ] && missing="$missing VPS_HOST"
          [ -z "$VPS_USER" ] && missing="$missing VPS_USERNAME"
          [ -z "$VPS_KEY" ] && missing="$missing VPS_SSH_KEY"
          [ -z "$VPS_SSH_KNOWN_HOSTS" ] && missing="$missing VPS_SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Required deployment secrets missing in GitHub Repository Secrets:$missing"
            echo "Please configure the required secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload source archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" \
              diskon-source.tar.gz "$VPS_USER@$VPS_HOST:diskon-source-${GITHUB_SHA}.tar.gz"

      - name: Validate services, back up, deploy, restart and health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DISKON_DEPLOY_DIR || '/home/ubuntu/platform-repos/diskon-bot' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$DEPLOY_DIR' '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          release="$2"
          service="diskon-bot-dashboard.service"

          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release commit hash"; exit 1; }
          test -d "$live" && test ! -L "$live" || { echo "Deployment directory not found: $live"; exit 1; }
          command -v rsync >/dev/null || { echo "rsync command not found"; exit 1; }

          sudo -n systemctl cat "$service" >/dev/null || { echo "Service $service not found"; exit 1; }
          sudo -n systemctl is-active "$service" >/dev/null || { echo "Service $service is not active"; exit 1; }
          test "$(sudo -n systemctl show -p WorkingDirectory --value "$service")" = "$live" || {
            echo "Service WorkingDirectory differs from expected deployment directory.";
            exit 1;
          }

          backup="$HOME/diskon-backup-$release.tar.gz"
          stage="$HOME/diskon-stage-$release"
          test ! -e "$backup" && test ! -e "$stage"

          mkdir "$stage"
          tar -xzf "$HOME/diskon-source-$release.tar.gz" -C "$stage"

          # Create clean backup of live code before updating
          tar --exclude='*.db' \
              --exclude='*.sqlite' \
              --exclude='*.sqlite3' \
              --exclude='config.py' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='node_modules' \
              --exclude='.runtime' \
              -czf "$backup" -C "$live" .

          rollback() {
            status="${1:-$?}"
            trap - ERR
            echo "::warning::Deployment encountered error (status $status). Executing automatic rollback..."
            if [ -s "$backup" ]; then
              restore="$HOME/diskon-restore-$release"
              rm -rf "$restore"
              mkdir -p "$restore"
              tar -xzf "$backup" -C "$restore"
              rsync -a --delete \
                  --exclude='*.db' \
                  --exclude='*.sqlite' \
                  --exclude='*.sqlite3' \
                  --exclude='config.py' \
                  --exclude='.env' \
                  --exclude='.env.*' \
                  --exclude='.git' \
                  --exclude='__pycache__' \
                  --exclude='venv' \
                  --exclude='.venv' \
                  --exclude='node_modules' \
                  --exclude='.runtime' \
                  "$restore/" "$live/"
              sudo -n systemctl restart "$service" || true
              rm -rf "$restore"
              echo "Rollback restored successfully from $backup."
            fi
            rm -rf "$stage"
            rm -f "$HOME/diskon-source-$release.tar.gz"
            exit "$status"
          }
          trap 'rollback $?' ERR

          # Sync new application code into live directory
          rsync -a --delete \
              --exclude='*.db' \
              --exclude='*.sqlite' \
              --exclude='*.sqlite3' \
              --exclude='config.py' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='node_modules' \
              --exclude='.runtime' \
              "$stage/" "$live/"

          # Update Python dependencies if virtualenv exists
          if [ -f "$live/venv/bin/pip" ]; then
            "$live/venv/bin/pip" install -q -r "$live/requirements.txt" || true
          elif [ -f "$live/.venv/bin/pip" ]; then
            "$live/.venv/bin/pip" install -q -r "$live/requirements.txt" || true
          fi

          # Restart the specific target service
          sudo -n systemctl restart "$service"

          # Health check: verify dashboard web endpoint and API health without -k
          healthy=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null && \
               curl -fsS http://127.0.0.1:8000/api/engine/status >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "Web/API health check failed on http://127.0.0.1:8000/. Triggering rollback."
            rollback 1
          fi

          trap - ERR
          rm -rf "$stage"
          rm -f "$HOME/diskon-source-$release.tar.gz"
          echo "Deployment successful: health check returned HTTP 200 OK for Web and API."
          echo "Database files, config.py, and .env were preserved. Backup retained at $backup"
          REMOTE
